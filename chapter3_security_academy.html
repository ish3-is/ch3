{title:'أساسيات الأخطاء البرمجية',en:'Introduction · Error / Fault / Failure',topics:[['Error','خطأ بشري','خطأ يرتكبه المبرمج أثناء التطوير.','كتابة شرط صلاحيات غير صحيح.'],['Fault','عيب في البرنامج','خلل في الكود أو التصميم ناتج عن خطأ.','استخدام شرط age >= 16 بدل 18.'],['Failure','إخفاق وظيفي','سلوك النظام ينحرف عن المطلوب.','قبول مستخدم غير مؤهل.'],['Flaw','خلل أمني','مصطلح عام يشمل Fault وFailure في سياق أمن البرمجيات.','الثغرات قد تنشأ دون نية خبيثة.']]},
{title:'تجاوز سعة الذاكرة',en:'Buffer Overflow · Memory Allocation',topics:[['Memory Buffer','المخزن المؤقت','مساحة في RAM لتخزين بيانات مؤقتة.','char name[8] يحجز 8 بايت.'],['Buffer Overflow','تجاوز المخزن','كتابة بيانات خارج مساحة الذاكرة المخصصة.','نسخ نص يحتاج 11 بايت إلى مصفوفة بحجم 8.'],['strcpy','نسخ غير محدود','تنسخ السلسلة حتى رمز النهاية دون معرفة سعة الوجهة.','قد تؤدي إلى تلف الذاكرة.'],['strncpy','نسخ محدد','تنسخ عددًا محددًا، لكنها قد لا تنهي النص برمز null.','يلزم الانتباه لرمز \\0.'],['strlcpy','نسخ مع إنهاء','تراعي سعة الوجهة وتضمن رمز null إذا كان الحجم غير صفري.','قد تقتطع النص؛ ليست متاحة بكل الأنظمة.'],['sizeof','حجم البيانات','يعطي حجم النوع أو المصفوفة بالبايت.','sizeof(buf) يحسب سعة مصفوفة محلية.'],['Program Counter','عداد البرنامج','سجل يشير إلى عنوان التعليمة التالية.','تغيّره القفزات والشروط واستدعاءات الدوال.']]},

{title:'البرمجيات الخبيثة',en:'Malware Families',topics:[['Malware','برمجيات خبيثة','برامج أو أكواد مصممة لإحداث تأثير ضار أو غير مرغوب.','سرقة البيانات أو إتلاف الملفات.'],['Virus','فيروس','ينتشر بإصابة ملفات أو برامج مضيفة.','برنامج تنفيذي مصاب.'],['Worm','دودة','ينسخ نفسه وينتشر عبر الشبكات.','انتقال تلقائي بين أجهزة ضعيفة الحماية.'],['Trojan Horse','حصان طروادة','برنامج يبدو شرعيًا ويخفي وظيفة خبيثة.','برنامج مجاني يسرق بيانات الدخول.'],['Bot','بوت','برنامج ينفذ مهامًا آلية، وليس بالضرورة ضارًا.','بوت محرك بحث يفهرس الصفحات.'],['Zombie','جهاز زومبي','جهاز مخترق يخضع للتحكم عن بُعد.','جهاز عضو في شبكة Botnet.'],['Backdoor','باب خلفي','مدخل يلتف على إجراءات الوصول المعتادة.','حساب صيانة سري غير موثق.']]},
{title:'أشكال أخرى من البرمجيات الخبيثة',en:'Other Malicious Code',topics:[['Rabbit','الأرنب','يتكاثر بإفراط ويستنزف الموارد.','إنشاء نسخ متتابعة حتى امتلاء الذاكرة.'],['Logic Bomb','قنبلة منطقية','تنشط عند تحقق شرط معين.','حدوث حدث في النظام.'],['Time Bomb','قنبلة زمنية','تنشط في وقت أو تاريخ معين.','موعد محدد مسبقًا.'],['Dropper','برنامج إسقاط','يثبت أو يستخرج برمجيات خبيثة إضافية.','ملف تثبيت ينشر برنامجًا ضارًا.'],['RAT','حصان طروادة للوصول عن بعد','يتيح وصولًا وتحكمًا غير مصرح به.','تحكم خفي في جهاز الضحية.'],['Spyware','تجسس','يجمع معلومات المستخدم سرًا.','التقاط نشاط المستخدم.'],['Rootkit','إخفاء اختراق','أدوات لإخفاء نشاط أو وجود برمجيات خبيثة.','إخفاء عمليات عن أدوات الرصد.'],['Browser Hijacker','اختطاف المتصفح','يغير إعدادات المتصفح أو يعيد التوجيه.','تغيير صفحة البحث دون إذن.'],['Scareware','برامج التخويف','يستخدم تحذيرات أمنية كاذبة لإخافة المستخدم.','تنبيه مزيف بوجود فيروسات.'],['Toolkit','حزمة أدوات','أدوات لاختبار الثغرات؛ قد تستخدم بشكل مشروع أو ضار.','مجموعة أدوات فحص بتصريح.']]},
{title:'انتشار الفيروسات ومراحل الإصابة',en:'Transmission · Activation · Stealth',topics:[['Harm','الضرر','التأثير على النظام أو المستخدم.','تلف بيانات أو تعطيل خدمة.'],['Propagation','الانتشار','انتقال البرمجيات الخبيثة أو نسخها.','دودة تنتشر عبر الشبكة.'],['Activation','التفعيل','بدء النشاط أو آليات إعادة التنشيط.','برمجية تعيد تشغيل نفسها مع النظام.'],['Stealth','التخفي','تقنيات تجنب الاكتشاف.','إخفاء نشاط خبيث.'],['Appended Virus','فيروس ملحق','ينفذ كوده ثم يسلم التحكم للبرنامج الأصلي.','البرنامج يبدو أنه يعمل طبيعيًا.'],['Surrounding Virus','فيروس محيط','يتحكم قبل تنفيذ البرنامج الأصلي وبعده.','كود خبيث قبل وبعد تشغيل التطبيق.'],['Integrated Virus','فيروس مدمج','يدمج كوده في الهدف أو يستبدله.','تلف البرنامج الأصلي أو اختفاؤه.'],['Nondestructive','غير مدمر','يسبب الإزعاج دون أن يهدف مباشرة لتدمير الملفات.','رسالة مزعجة على الشاشة.'],['Destructive','مدمر','يتلف البيانات أو البرامج أو الأنظمة.','حذف ملفات.'],['Criminal Intent','هدف إجرامي','يسعى للسرقة أو السيطرة أو الربح غير المشروع.','تسريب بيانات حساسة.']]},

{title:'الهندسة الاجتماعية',en:'Social Engineering',topics:[['Social Engineering','الهندسة الاجتماعية','التلاعب النفسي بالإنسان للحصول على معلومات أو وصول.','انتحال الدعم الفني.'],['Phishing','تصيد احتيالي','رسائل مزورة تبدو من جهات موثوقة.','بريد بنك مزيف.'],['Spear Phishing','تصيد موجه','رسائل احتيالية مخصصة لفرد أو مؤسسة.','رسالة باسم المدير المالي.'],['Pretexting','اختلاق ذريعة','بناء قصة وهمية لكسب الثقة.','انتحال موظف موارد بشرية.'],['Baiting','الإغراء','استخدام طعم جذاب لخداع الضحية.','USB مكتوب عليه مكافآت.'],['Tailgating','التسلل خلف المخولين','دخول مكان مقيد خلف شخص مصرح له.','دخول غرفة خوادم دون بطاقة.']]},
{title:'وسائل الحماية والكشف',en:'Countermeasures · Penetration Testing',topics:[['User Vigilance','يقظة المستخدم','التحقق من البرامج والمرفقات والمواقع.','عدم فتح مرفقات مجهولة.'],['Isolation','عزل البرامج','تجربة الملفات المشكوك فيها داخل بيئة معزولة.','آلة افتراضية معزولة.'],['Backups','نسخ احتياطي','نسخ يمكن استعادتها بعد تلف أو إصابة.','نسخة منفصلة من ملفات العمل.'],['Penetration Testing','اختبار اختراق','اختبار مصرح به لاكتشاف الثغرات والتحقق منها.','تقييم صلاحيات تطبيق.'],['Virus Scanner','ماسح فيروسات','يكشف مؤشرات البرمجيات الخبيثة.','فحص برنامج مشبوه.'],['Signature','توقيع','نمط يساعد على التعرف على برمجية خبيثة.','تسلسل بايتات معروف.'],['Behavior Detection','كشف سلوكي','يرصد أنشطة مشبوهة وليس التواقيع فقط.','برنامج يشفر ملفات كثيرة بصورة غير معتادة.']]}

];
const safeGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};let completed=safeGet('cyber3_done',[]),answers=safeGet('cyber3_answers',{}),submitted=false,current='home',chapter=0,sim='buffer',bufferSize=8,bufferInput=10,ival1=200,ival2=100,infectStage=0;
function save(){try{localStorage.setItem('cyber3_done',JSON.stringify(completed));localStorage.setItem('cyber3_answers',JSON.stringify(answers))}catch{}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){document.getElementById('nav').innerHTML=[['home','🏠','الرئيسية'],['lessons','📚','الدروس التسعة'],['lab','🧪','المختبر التفاعلي'],['glossary','🔎','قاموس المصطلحات'],['quiz','📝','الاختبار النهائي']].map(([id,ico,name])=>`<button class="nav ${current===id?'active':''}" onclick="go('${id}')"><span>${ico}</span>${name}</button>`).join('');let pct=Math.round(completed.length/lessons.length*100);document.getElementById('progressLabel').textContent=pct+'%';document.getElementById('bar').style.width=pct+'%'}function go(v){current=v;nav();render();window.scrollTo(0,0)}function selectLesson(i){chapter=i;go('lessons')}
function home(){return `<section class="hero"><span class="eyebrow">INTERACTIVE CYBERSECURITY LEARNING</span><h1>أمن البرامج والبرمجة</h1><div style="direction:ltr;text-align:right;color:#bfaaff;font-weight:700">CHAPTER 03 · Programs and Programming Security</div><p>تعلّم الشابتر خطوة بخطوة، جرّب محاكاة الثغرات بشكل آمن، افهم الهجمات، ثم اختبر معلوماتك بأسئلة إنجليزية وتصحيح فوري. شرح عربي وأمثلة تطبيقية.</p><div class="row"><button class="btn" onclick="selectLesson(0)">ابدأ التعلّم ←</button><button class="btn secondary" onclick="go('lab')">افتح المختبر</button></div></section><div class="stats"><div class="stat"><strong>09</strong><small>وحدات تعليمية</small></div><div class="stat"><strong>05</strong><small>محاكاة تفاعلية</small></div><div class="stat"><strong>20</strong><small>سؤال اختبار نهائي</small></div></div><section class="section"><div class="head"><h2>خريطة الشابتر</h2><span class="pill">ابدأ بأي وحدة</span></div><div class="cards">${lessons.map((l,i)=>`<div class="card"><div class="split"><span class="pill">LESSON ${String(i+1).padStart(2,'0')}</span><span>${completed.includes(i)?'✅':'◯'}</span></div><h3 style="margin-top:13px">${l.title}</h3><p style="direction:ltr;text-align:right;font-size:11px">${l.en}</p><button class="btn secondary" onclick="selectLesson(${i})">فتح الدرس ←</button></div>`).join('')}</div></section><section class="section"><div class="card"><h3>🎯 خطة المراجعة</h3><p>راجع تعريف كل مصطلح بالإنجليزية، ثم اقرأ ترجمته وشرحه بالعربية. جرّب المختبر قبل حل الاختبار النهائي. جميع التجارب محاكاة مرئية محلية ولا تنفذ أي سلوك ضار.</p></div></section>`}
function lessonsView(){let l=lessons[chapter];return `<div class="head"><div><div class="eyebrow">LESSON ${chapter+1} / ${lessons.length}</div><h1>${l.title}</h1><p style="direction:ltr;text-align:right">${l.en}</p></div><button class="btn secondary" onclick="go('home')">الخريطة</button></div><div class="tabs">${lessons.map((a,i)=>`<button class="${i===chapter?'active':''}" onclick="selectLesson(${i})">${i+1}. ${a.title}</button>`).join('')}</div>${l.topics.map(([en,ar,desc,example],i)=>`<article class="lesson"><div class="split"><h3>${i+1}. ${esc(en)} — ${esc(ar)}</h3><span class="tag">مفهوم أساسي</span></div><div class="original">${esc(en)}</div><p class="translation">${esc(desc)}</p><div class="example">💡 مثال عملي: ${esc(example)}</div></article>`).join('')}<div class="row space section"><button class="btn secondary" ${chapter===0?'disabled':''} onclick="selectLesson(${chapter-1})">السابق</button><button class="btn good" onclick="mark(${chapter})">${completed.includes(chapter)?'✓ تم إكمال الدرس':'✓ تحديد الدرس كمكتمل'}</button><button class="btn" ${chapter===lessons.length-1?'disabled':''} onclick="selectLesson(${chapter+1})">التالي</button></div>`}
function mark(i){if(!completed.includes(i)){completed.push(i);save()}nav();render()}
function lab(){let tabs=[['buffer','Buffer Overflow'],['integer','Integer Overflow'],['virus','Virus Attachment'],['worm','Worm Spread'],['social','Social Engineering']];return `<div class="eyebrow">SECURITY SIMULATION LAB</div><h1>المختبر التفاعلي</h1><p>تجارب تعليمية آمنة. لا يتم تحميل أو تشغيل أي كود خبيث.</p><div class="tabs">${tabs.map(([id,name])=>`<button class="${sim===id?'active':''}" onclick="sim='${id}';render()">${name}</button>`).join('')}</div><div class="lesson">${sim==='buffer'?bufferLab():sim==='integer'?integerLab():sim==='virus'?virusLab():sim==='worm'?wormLab():socialLab()}</div>`}
function bufferLab(){let source='ABCDEFGHIJKLMNO';let count=Math.min(15,bufferInput);return `<h2>Buffer Overflow Simulator</h2><p>غير حجم المخزن وعدد البايتات المكتوبة، وشاهد متى يحدث التجاوز.</p><div class="grid2"><div><label>حجم Buffer: <strong>${bufferSize}</strong> bytes</label><input type="range" min="4" max="12" value="${bufferSize}" oninput="bufferSize=+this.value;render()"></div><div><label>البايتات المكتوبة: <strong>${bufferInput}</strong></label><input type="range" min="0" max="15" value="${bufferInput}" oninput="bufferInput=+this.value;render()"></div></div><div class="visual"><div class="bytes">${Array.from({length:15},(_,i)=>`<div class="byte ${i>=bufferSize&&i<count?'bad':i>=count?'empty':''}">${i<count?source[i]:'·'}</div>`).join('')}</div><p class="mini">الأخضر: داخل السعة · الأحمر: تجاوز حدود الذاكرة</p></div><div class="result ${bufferInput>bufferSize?'warning':'success'}">${bufferInput>bufferSize?`⚠️ Overflow: تم تجاوز السعة بمقدار ${bufferInput-bufferSize} بايت.`:'✓ لا يوجد تجاوز للحدود في هذه المحاكاة.'}</div><p class="note">هذه المحاكاة لا تحسب بايت نهاية النص null. في C تحتاج السلاسل النصية إلى بايت إضافي.</p>`}
function integerLab(){let s=ival1+ival2,res=s%256;return `<h2>Integer Overflow Simulator</h2><p>Unsigned 8-bit: الحد الأعلى 255. يلتف الناتج عند التخزين modulo 256.</p><div class="grid2"><div><label>c = <strong>${ival1}</strong></label><input type="range" min="0" max="255" value="${ival1}" oninput="ival1=+this.value;render()"></div><div><label>d = <strong>${ival2}</strong></label><input type="range" min="0" max="255" value="${ival2}" oninput="ival2=+this.value;render()"></div></div><div class="visual"><div class="grid2"><div class="stat"><small>Mathematical result</small><strong>${s}</strong></div><div class="stat"><small>Stored in uint8</small><strong style="color:${s>255?'var(--bad)':'var(--good)'}">${res}</strong></div></div><p dir="ltr" style="text-align:center;font-family:monospace">${s} mod 256 = ${res}</p><div class="bytes">${res.toString(2).padStart(8,'0').split('').map(x=>`<div class="byte">${x}</div>`).join('')}</div></div><div class="result ${s>255?'warning':'success'}">${s>255?'⚠️ Integer Overflow في uint8':'✓ ضمن المجال المسموح'}</div><p class="note">الالتفاف مضمون للنوع unsigned في C؛ أما تجاوز signed int فقد يؤدي إلى سلوك غير معرّف.</p>`}
function virusLab(){return `<h2>Virus Attachment Visualizer</h2><p>شاهد الفروق بين الفيروس الملحق والمحيط والمدمج. جميع الأمثلة مجرد مخططات.</p><div class="tabs"><button onclick="document.getElementById('vdesc').innerHTML=virusDiagram('appended')">Appended</button><button onclick="document.getElementById('vdesc').innerHTML=virusDiagram('surrounding')">Surrounding</button><button onclick="document.getElementById('vdesc').innerHTML=virusDiagram('integrated')">Integrated</button></div><div id="vdesc">${virusDiagram('appended')}</div>`}
function virusDiagram(type){let nodes=type==='appended'?['🦠 كود فيروسي','→','🖥️ البرنامج الأصلي']:type==='surrounding'?['🦠 قبل','→','🖥️ البرنامج الأصلي','→','🦠 بعد']:['🖥️ برنامج أصلي','→','🧬 إدراج / استبدال أجزاء بالكود الخبيث'];let desc={appended:'ينفذ الفيروس نشاطه ثم ينتقل إلى البرنامج الأصلي.',surrounding:'يتحكم الفيروس قبل تنفيذ البرنامج الأصلي وبعده.',integrated:'يدمج الكود الخبيث مع البرنامج أو يحل مكانه.'};return `<div class="visual"><div class="flow">${nodes.map(n=>`<span>${n}</span>`).join('')}</div></div><div class="result">${desc[type]}</div>`}
function wormLab(){let n=[1,2,4,8,12][infectStage];return `<h2>Worm Propagation</h2><p>محاكاة مرئية لتوسع الإصابة عبر الشبكة. كل ضغطة تمثل مرحلة انتشار افتراضية.</p><div class="visual"><div class="bytes" style="direction:rtl">${Array.from({length:12},(_,i)=>`<div class="byte ${i<n?'bad':'empty'}">${i<n?'☠':'💻'}</div>`).join('')}</div></div><div class="result">عدد الأجهزة المصابة: ${n} / 12</div><div class="row"><button class="btn" onclick="infectStage=(infectStage+1)%5;render()">${infectStage===4?'إعادة':'انتشار المرحلة التالية'}</button><button class="btn secondary" onclick="infectStage=0;render()">إعادة ضبط</button></div><p class="note">توضيح نظري فقط: لا توجد شبكة حقيقية أو انتشار برمجيات.</p>`}
const social=[['بريد مزيف من بنك إلى مستخدمين كثيرين','Phishing'],['رسالة مخصصة للمدير المالي باسمه','Spear Phishing'],['متصل يدعي أنه من الدعم الفني ويختلق عذرًا','Pretexting'],['USB بعنوان المكافآت متروك في الممر','Baiting'],['شخص يدخل خلف موظف لغرفة الخوادم','Tailgating']];let socialIx=0;function socialLab(){return `<h2>Identify Social Engineering</h2><p>اقرأ السيناريو وحدد نوع الهندسة الاجتماعية:</p>${social.map(([s,a],i)=>`<div class="q" style="background:#151f35;padding:12px;margin:9px 0;border-radius:10px"><div>${i+1}. ${s}</div><div class="row" style="margin-top:7px"><button class="btn secondary" onclick="this.nextElementSibling.classList.toggle('hidden')">إظهار النوع</button><span class="hidden success">${a}</span></div></div>`).join('')}`}
function glossary(){return `<div class="eyebrow">QUICK REFERENCE</div><h1>قاموس الشابتر</h1><p>بحث فوري عن المفاهيم الإنجليزية وشرحها بالعربي.</p><input id="termSearch" class="search" placeholder="ابحث عن مصطلح مثل Rootkit أو Buffer..." oninput="filterTerms()"><div id="terms" class="terms section">${termsHtml('')}</div>`}function termsHtml(q){return lessons.flatMap(l=>l.topics).filter(t=>t.join(' ').toLowerCase().includes(q.toLowerCase())).map(([en,ar,d,e])=>`<div class="term"><strong>${esc(en)}</strong><small>${esc(ar)}</small><p>${esc(d)}</p></div>`).join('')||'<p>لا توجد نتائج مطابقة.</p>'}function filterTerms(){document.getElementById('terms').innerHTML=termsHtml(document.getElementById('termSearch').value)}
function quizView(){return `<div class="eyebrow">FINAL EXAM · 20 QUESTIONS</div><h1>اختبار الشابتر الثالث</h1><p>اختبار بالإنجليزية على أهم نقاط الشابتر. اختر الإجابات ثم اضغط التصحيح؛ بعدها يظهر الشرح بالعربية.</p><div class="row space"><span class="pill">${Object.keys(answers).length} / ${quiz.length} إجابة</span><button class="btn secondary" onclick="if(confirm('هل تريد إعادة الاختبار؟')){answers={};submitted=false;save();render()}">إعادة الاختبار</button></div><div class="progress"><div style="width:${Object.keys(answers).length/quiz.length*100}%"></div></div><div class="questions">${quiz.map(([q,opts,correct,reason],i)=>`<div class="q"><div class="split"><h3 style="direction:ltr;text-align:left;font-size:14px">Q${i+1}. ${esc(q)}</h3><span class="badge">${i<16?'5/5':'4/5'}</span></div>${opts.map((opt,j)=>`<button class="option ${answers[i]===j?'selected':''} ${submitted&&j===correct?'correct':''} ${submitted&&answers[i]===j&&j!==correct?'wrong':''}" ${submitted?'disabled':''} onclick="answers[${i}]=${j};save();render()" style="direction:ltr;text-align:left">${String.fromCharCode(65+j)}. ${esc(opt)}</button>`).join('')}${submitted?`<div class="result ${answers[i]===correct?'success':'warning'}">${answers[i]===correct?'✓ Correct':'✗ Incorrect'} · Correct: ${esc(opts[correct])}<div class="mini">${esc(reason)}</div></div>`:''}</div>`).join('')}</div>${submitted?`<div class="result"><h2>النتيجة: ${quiz.filter((q,i)=>q[2]===answers[i]).length} / ${quiz.length}</h2><p>راجع الإجابات التي أخطأت بها، ثم أعد المحاولة.</p></div>`:`<button class="btn good" ${Object.keys(answers).length!==quiz.length?'disabled':''} onclick="submitted=true;render();window.scrollTo({top:0,behavior:'smooth'})">تصحيح الاختبار وعرض النتيجة</button>`}`}
function render(){document.getElementById('main').innerHTML=(current==='home'?home():current==='lessons'?lessonsView():current==='lab'?lab():current==='glossary'?glossary():quizView())+'<div class="footer">CYBERLAB ACADEMY · CHAPTER 03 · محتوى تعليمي ومحاكاة آمنة فقط · يعمل دون اتصال بعد حفظ الملف (باستثناء خط Cairo الاختياري من Google Fonts).</div>';nav()};render();
</script></body></html>
